   "text": "POLIZZA ASSICURAZIONE RESPONSABILITÀ CIVILE VEICOLI E MOBILITÀ\nCondizioni di assicurazione — edizione 2026\n\n1. OGGETTO E DURATA\n\n1.1 La presente polizza copre la responsabilità civile derivante dalla\n    circolazione del veicolo identificato nel frontespizio di polizza, unitamente\n    alle eventuali coperture complementari sottoscritte.\n\n1.2 Durata del contratto: 1 (un) anno, con decorrenza dalla data indicata nel\n    frontespizio.\n\n1.3 RINNOVO. Alla scadenza il contratto si rinnova tacitamente di anno in anno,\n    salvo disdetta di una delle parti.\n\n1.4 DISDETTA. La disdetta deve pervenire alla Compagnia in forma scritta almeno\n    90 (novanta) giorni prima della scadenza annuale. La disdetta pervenuta oltre\n    tale termine è inefficace e il contratto si intende rinnovato per un\n    ulteriore anno.\n\n2. PREMIO\n\n2.1 Premio annuo lordo: CHF 780.00, comprensivo di imposte e oneri fiscali.\n\n2.2 Frazionamento. Su richiesta il premio può essere corrisposto in rate mensili.\n    In tal caso la rata mensile è di CHF 68.00 e il premio annuo complessivo\n    ammonta a CHF 816.00.\n\n2.3 La maggiorazione di cui al punto 2.2 costituisce il corrispettivo del\n    frazionamento e non è rimborsabile in caso di cessazione anticipata.\n\n2.4 Spese di emissione e quietanza: CHF 25.00, una tantum, alla stipulazione.\n\n3. SCONTO PER IMPEGNO PLURIENNALE\n\n3.1 Il Contraente che si impegna a mantenere in vigore la polizza per 3 (tre)\n    annualità consecutive beneficia di uno sconto del 15.00% sul premio annuo\n    lordo di cui al punto 2.1.\n\n3.2 In caso di disdetta o cessazione prima del compimento della terza annualità,\n    il Contraente è tenuto a restituire integralmente gli sconti fruiti nelle\n    annualità precedenti.\n\n3.3 La restituzione è dovuta entro 30 giorni dalla richiesta della Compagnia.\n\n4. FRANCHIGIE E MASSIMALI\n\n4.1 Franchigia per sinistro con colpa, copertura collisione: CHF 1'000.00.\n4.2 Massimale di responsabilità civile: CHF 100'000'000.00.\n4.3 Copertura furto e incendio: franchigia CHF 500.00.\n\n5. ADEGUAMENTI DEL PREMIO\n\n5.1 La Compagnia può adeguare il premio con effetto dalla scadenza annuale,\n    dandone comunicazione al Contraente almeno 25 giorni prima di tale data.\n5.2 In tal caso il Contraente può disdire il contratto entro 30 giorni dal\n    ricevimento della comunicazione, in deroga al termine di cui al punto 1.4.\n\n6. SINISTRI\n\n6.1 I sinistri devono essere denunciati entro 5 giorni dalla conoscenza\n    dell'evento.\n6.2 Il sistema bonus-malus prevede un peggioramento di 3 livelli per ciascun\n    sinistro con colpa liquidato.\n\n7. FORO COMPETENTE\n\nPer ogni controversia è competente il foro del domicilio del Contraente.\n\nLuogo e data ______________________\nFirma del Contraente ______________________\n",

civile: CHF 100'000'000.00.\n4.3 Copertura furto e incendio: franchigia CHF 500.00.\n\n5. ADEGUAMENTI DEL PREMIO\n\n5.1 La Compagnia può adeguare il premio con effetto dalla scadenza annuale,\n    dandone comunicazione al Contraente almeno 25 giorni prima di tale data.\n5.2 In tal caso il Contraente può disdire il contratto entro 30 giorni dal\n    ricevimento della comunicazione, in deroga al termine di cui al punto 1.4.\n\n6. SINISTRI\n\n6.1 I sinistri devono essere denunciati entro 5 giorni dalla conoscenza\n    dell'evento.\n6.2 Il sistema bonus-malus prevede un peggioramento di 3 livelli per ciascun\n    sinistro con colpa liquidato.\n\n7. FORO COMPETENTE\n\nPer ogni controversia è competente il foro del domicilio del Contraente.\n\nLuogo e data ______________________\nFirma del Contraente ______________________\n",

   "text": "CONTRATO DE CRÉDITO AL CONSUMO\nPréstamo personal sin garantía — Formulario PL/2026\n\nResumen de condiciones y condiciones financieras\n\nArt. 1 — Objeto\nEl Prestamista concede al Cliente un préstamo personal sin garantía por un\nimporte neto desembolsado de CHF 12'000.00 (doce mil/00), reembolsable con\narreglo al cuadro de amortización que se adjunta al presente contrato.\n\nArt. 2 — Condiciones financieras\n2.1 Importe total del crédito: CHF 12'000.00\n2.2 Plazo de reembolso: 36 (treinta y seis) meses\n2.3 Importe de cada cuota mensual: CHF 375.50\n2.4 Tipo nominal anual fijo (TIN): 7.90%\n2.5 Tasa anual equivalente (TAE): 10.34%\n2.6 La primera cuota vence el día 5 del mes siguiente al desembolso.\n\nArt. 3 — Comisiones y gastos\n3.1 Comisión de apertura y de estudio: CHF 250.00, pagadera en el momento\n    del desembolso.\n3.2 Comisión de cobro y de gestión de cada cuota: CHF 3.00 por cuota, que se\n    carga junto con la propia cuota.\n3.3 Extractos periódicos: gratuitos si se entregan por vía electrónica.\n3.4 Impuesto de timbre sobre el extracto anual: a cargo del Cliente cuando\n    resulte aplicable.\n\nArt. 4 — Cobertura de seguro\n4.1 El Cliente podrá adherirse, sin estar obligado a ello, a la póliza\n    colectiva \"Protección de Pagos\", que cubre los riesgos de fallecimiento,\n    invalidez permanente y desempleo.\n4.2 En caso de adhesión, la prima asciende a CHF 8.50 por cada cuota y se\n    carga junto con la cuota.\n4.3 La no adhesión no altera las condiciones financieras establecidas en el\n    Art. 2.\n\nArt. 5 — Amortización anticipada\n5.1 El Cliente podrá reembolsar anticipadamente el capital pendiente, total o\n    parcialmente, en cualquier momento, mediante preaviso escrito de 30\n    (treinta) días.\n5.2 En caso de amortización anticipada se devengará una comisión del 1.00%\n    del capital pendiente reembolsado anticipadamente, cuando el plazo\n    restante del contrato sea superior a 12 meses.\n5.3 Cuando el plazo restante sea igual o inferior a 12 meses, no se devengará\n    comisión alguna.\n5.4 Las comisiones previstas en el Art. 3.2 devengadas hasta la fecha de\n    liquidación seguirán siendo exigibles.\n\nArt. 6 — Demora en el pago\n6.1 En caso de pago tardío de una cuota se devengarán intereses de demora al\n    tipo nominal anual incrementado en 2 puntos porcentuales.\n6.2 Comisión por reclamación escrita: CHF 20.00 por cada reclamación.\n\nArt. 7 — Duración y renovación\n7.1 El contrato se extingue con el pago de la última cuota.\n7.2 El presente contrato no prevé prórroga tácita.\n\nArt. 8 — Derecho de desistimiento\n8.1 El Cliente podrá desistir del contrato en el plazo de 14 (catorce) días\n    desde su celebración, sin necesidad de justificación y sin penalización,\n    mediante comunicación escrita.\n8.2 En caso de desistimiento, el Cliente devolverá el capital desembolsado\n    junto con los intereses devengados hasta la fecha de la devolución.\n\nArt. 9 — Fuero competente\nCualquier controversia se someterá al fuero del domicilio del Cliente.\n\nLugar y fecha ______________________\nFirma del Cliente ______________________\n",

  "01b_personal_loan": {
   "title": "Préstamo personal · oferta B — CHF 12'000 a 48 meses",
   "text": "CONTRATO DE CRÉDITO AL CONSUMO\nPréstamo personal sin garantía — Formulario PL-B/2026\n\nResumen de condiciones y condiciones financieras\n\nArt. 1 — Objeto\nEl Prestamista concede al Cliente un préstamo personal sin garantía por un\nimporte neto desembolsado de CHF 12'000.00 (doce mil/00), reembolsable con\narreglo al cuadro de amortización que se adjunta al presente contrato.\n\nArt. 2 — Condiciones financieras\n2.1 Importe total del crédito: CHF 12'000.00\n2.2 Plazo de reembolso: 48 (cuarenta y ocho) meses\n2.3 Importe de cada cuota mensual: CHF 286.80\n2.4 Tipo nominal anual fijo (TIN): 6.90%\n2.5 Tasa anual equivalente (TAE): 8.69%\n2.6 La primera cuota vence el día 5 del mes siguiente al desembolso.\n\nArt. 3 — Comisiones y gastos\n3.1 Comisión de apertura y de estudio: CHF 150.00, pagadera en el momento\n    del desembolso.\n3.2 Comisión de cobro y de gestión de cada cuota: CHF 4.50 por cuota, que se\n    carga junto con la propia cuota.\n3.3 Extractos periódicos: gratuitos si se entregan por vía electrónica.\n3.4 Impuesto de timbre sobre el extracto anual: a cargo del Cliente cuando\n    resulte aplicable.\n\nArt. 4 — Cobertura de seguro\n4.1 El Cliente podrá adherirse, sin estar obligado a ello, a la póliza\n    colectiva \"Protección de Pagos\", que cubre los riesgos de fallecimiento,\n    invalidez permanente y desempleo.\n4.2 En caso de adhesión, la prima asciende a CHF 9.90 por cada cuota y se\n    carga junto con la cuota.\n4.3 La no adhesión no altera las condiciones financieras establecidas en el\n    Art. 2.\n\nArt. 5 — Amortización anticipada\n5.1 El Cliente podrá reembolsar anticipadamente el capital pendiente, total o\n    parcialmente, en cualquier momento, mediante preaviso escrito de 30\n    (treinta) días.\n5.2 En caso de amortización anticipada se devengará una comisión del 1.00%\n    del capital pendiente reembolsado anticipadamente, cuando el plazo\n    restante del contrato sea superior a 12 meses.\n5.3 Cuando el plazo restante sea igual o inferior a 12 meses, no se devengará\n    comisión alguna.\n5.4 Las comisiones previstas en el Art. 3.2 devengadas hasta la fecha de\n    liquidación seguirán siendo exigibles.\n\nArt. 6 — Demora en el pago\n6.1 En caso de pago tardío de una cuota se devengarán intereses de demora al\n    tipo nominal anual incrementado en 2 puntos porcentuales.\n6.2 Comisión por reclamación escrita: CHF 20.00 por cada reclamación.\n\nArt. 7 — Duración y renovación\n7.1 El contrato se extingue con el pago de la última cuota.\n7.2 El presente contrato no prevé prórroga tácita.\n\nArt. 8 — Derecho de desistimiento\n8.1 El Cliente podrá desistir del contrato en el plazo de 14 (catorce) días\n    desde su celebración, sin necesidad de justificación y sin penalización,\n    mediante comunicación escrita.\n8.2 En caso de desistimiento, el Cliente devolverá el capital desembolsado\n    junto con los intereses devengados hasta la fecha de la devolución.\n\nArt. 9 — Fuero competente\nCualquier controversia se someterá al fuero del domicilio del Cliente.\n\nLugar y fecha ______________________\nFirma del Cliente ______________________\n",

  "02_car_lease": {
   "title": "Leasing de coche · oferta A — CHF 349 al mes durante 48 meses",
   "text": "CONTRATO DE ARRENDAMIENTO FINANCIERO DE VEHÍCULO — USO PRIVADO\nFormulario LEA-P/2026 — Condiciones particulares y generales\n\nA. CONDICIONES PARTICULARES\n\nA.1 Vehículo: turismo, precio de tarifa puesto en carretera CHF 28'000.00\nA.2 Entrada (primera cuota incrementada) a la entrega: CHF 4'000.00\nA.3 Cuota mensual: CHF 349.00, con vencimiento el día 1 de cada mes\nA.4 Duración del contrato: 48 (cuarenta y ocho) meses\nA.5 Valor residual / precio de la opción de compra al vencimiento: CHF 9'800.00\nA.6 Comisión de contrato única: CHF 390.00, exigible a la firma\nA.7 Kilometraje máximo permitido: 15'000 km por año de contrato\nA.8 Exceso de kilometraje: CHF 0.25 por cada kilómetro en exceso\nA.9 Kilometraje no utilizado: se reembolsa a razón de CHF 0.10 por kilómetro,\n    hasta un máximo de 5'000 km en total\n\nB. CONDICIONES GENERALES\n\nB.1 Propiedad\nEl vehículo permanece en propiedad de la Sociedad de Leasing durante toda la\nvigencia del contrato. El Cliente adquiere únicamente el derecho de uso.\n\nB.2 Seguro\nB.2.1 El Cliente está obligado a suscribir y a mantener, durante toda la\n      vigencia del contrato, una cobertura de seguro a todo riesgo con una\n      franquicia no superior a CHF 1'000.00. La cobertura no está incluida\n      en la cuota.\nB.2.2 La falta de suscripción o de mantenimiento de la cobertura constituye\n      un incumplimiento esencial y faculta a la Sociedad de Leasing para\n      resolver el contrato con efecto inmediato.\n\nB.3 Mantenimiento\nEl mantenimiento ordinario y extraordinario, los impuestos de circulación y\nlos gastos de uso corren íntegramente a cargo del Cliente y no están\nincluidos en la cuota.\n\nB.4 Resolución anticipada a instancia del Cliente\nB.4.1 El Cliente podrá solicitar la resolución anticipada del contrato una\n      vez transcurridos al menos 12 meses desde su inicio, mediante preaviso\n      escrito de 60 (sesenta) días.\nB.4.2 En tal caso el Cliente estará obligado a abonar la suma de las cuotas\n      aún no vencidas, incrementada en una indemnización del 5.00% de dicha\n      suma en concepto de valor no amortizado.\nB.4.3 Será asimismo exigible la comisión de peritaje y de devolución del\n      vehículo de CHF 450.00.\nB.4.4 El eventual exceso de kilometraje se calculará a la fecha de devolución.\n\nB.5 Opción de compra\nB.5.1 Al vencimiento natural el Cliente podrá adquirir el vehículo al precio\n      establecido en el punto A.5, mediante preaviso de 30 días.\nB.5.2 A falta de dicho preaviso, el vehículo se devolverá a la Sociedad de\n      Leasing.\n\nB.6 Devolución\nB.6.1 En el momento de la devolución se peritará el vehículo. Los daños que\n      excedan del desgaste normal por el uso se cargarán al Cliente conforme\n      al baremo de daños adjunto.\nB.6.2 Comisión de peritaje al vencimiento natural: CHF 250.00.\n\nB.7 Duración y renovación\nEl contrato no se renueva de forma tácita y se extingue en el vencimiento\nestablecido en el punto A.4, salvo ejercicio de la opción de compra.\n\nB.8 Demora en el pago\nIntereses de demora del 5.00% anual sobre los importes vencidos; comisión de\nreclamación de CHF 30.00 por cada aviso.\n\nLugar y fecha ______________________\nFirma del Cliente ______________________\n",

  "03_motor_policy": {
   "title": "Póliza de coche · oferta A — CHF 68 al mes, prórroga tácita",
   "text": "PÓLIZA DE SEGURO DE RESPONSABILIDAD CIVIL DE VEHÍCULOS Y MOVILIDAD\nCondiciones del seguro — edición 2026\n\n1. OBJETO Y DURACIÓN\n\n1.1 La presente póliza cubre la responsabilidad civil derivada de la\n    circulación del vehículo identificado en las condiciones particulares,\n    junto con las coberturas adicionales que se hubieran contratado.\n\n1.2 Duración del contrato: 1 (un) año, con inicio en la fecha indicada en\n    las condiciones particulares.\n\n1.3 PRÓRROGA. Al vencimiento el contrato se prorroga tácitamente de año en\n    año, salvo resolución por cualquiera de las partes.\n\n1.4 RESOLUCIÓN. La comunicación de resolución deberá llegar a la Compañía\n    por escrito con al menos 90 (noventa) días de antelación a la fecha de\n    vencimiento anual. La comunicación recibida con posterioridad a dicho\n    plazo carecerá de eficacia y el contrato se entenderá prorrogado por un\n    año más.\n\n2. PRIMA\n\n2.1 Prima anual bruta: CHF 780.00, impuestos y recargos incluidos.\n\n2.2 Fraccionamiento. A petición del Tomador, la prima podrá abonarse en\n    cuotas mensuales. En tal caso la cuota mensual asciende a CHF 68.00 y la\n    prima anual total asciende a CHF 816.00.\n\n2.3 El recargo previsto en el punto 2.2 constituye la contraprestación por el\n    pago fraccionado y no es reembolsable en caso de resolución anticipada.\n\n2.4 Comisión de emisión y de recibo: CHF 25.00, de pago único, a la\n    contratación.\n\n3. DESCUENTO POR COMPROMISO PLURIANUAL\n\n3.1 El Tomador que se comprometa a mantener la póliza en vigor durante 3\n    (tres) anualidades consecutivas obtendrá un descuento del 15.00% sobre la\n    prima anual bruta prevista en el punto 2.1.\n\n3.2 En caso de resolución o extinción antes de completar la tercera\n    anualidad, el Tomador estará obligado a reintegrar íntegramente los\n    descuentos obtenidos en las anualidades anteriores.\n\n3.3 El reintegro será exigible en el plazo de 30 días desde el requerimiento\n    de la Compañía.\n\n4. FRANQUICIAS Y LÍMITES\n\n4.1 Franquicia por siniestro con culpa, cobertura de colisión: CHF 1'000.00.\n4.2 Límite de indemnización de responsabilidad civil: CHF 100'000'000.00.\n4.3 Cobertura de robo e incendio: franquicia de CHF 500.00.\n\n5. MODIFICACIONES DE LA PRIMA\n\n5.1 La Compañía podrá modificar la prima con efectos desde la fecha de\n    vencimiento anual, comunicándolo al Tomador con al menos 25 días de\n    antelación a dicha fecha.\n5.2 En tal caso el Tomador podrá resolver el contrato en el plazo de 30 días\n    desde la recepción de la comunicación, como excepción al plazo previsto\n    en el punto 1.4.\n\n6. SINIESTROS\n\n6.1 Los siniestros deberán comunicarse en el plazo de 5 días desde que se\n    tuvo conocimiento del hecho.\n6.2 El sistema bonus-malus prevé un descenso de 3 niveles por cada siniestro\n    con culpa liquidado.\n\n7. FUERO COMPETENTE\n\nCualquier controversia se someterá al fuero del domicilio del Tomador.\n\nLugar y fecha ______________________\nFirma del Tomador ______________________\n",

   "text": "PÓLIZA DE SEGURO DE RESPONSABILIDAD CIVIL DE VEHÍCULOS Y MOVILIDAD\nCondiciones del seguro — edición 2026\n\n1. OBJETO Y DURACIÓN\n\n1.1 La presente póliza cubre la responsabilidad civil derivada de la\n    circulación del vehículo identificado en las condiciones particulares,\n    junto con las coberturas adicionales que se hubieran contratado.\n\n1.2 Duración del contrato: 1 (un) año, con inicio en la fecha indicada en\n    las condiciones particulares.\n\n1.3 PRÓRROGA. Al vencimiento el contrato se prorroga tácitamente de año en\n    año, salvo resolución por cualquiera de las partes.\n\n1.4 RESOLUCIÓN. La comunicación de resolución deberá llegar a la Compañía\n    por escrito con al menos 90 (noventa) días de antelación a la fecha de\n    vencimiento anual. La comunicación recibida con posterioridad a dicho\n    plazo carecerá de eficacia y el contrato se entenderá prorrogado por un\n    año más.\n\n2. PRIMA\n\n2.1 Prima anual bruta: CHF 715.00, impuestos y recargos incluidos.\n\n2.2 Fraccionamiento. A petición del Tomador, la prima podrá abonarse en\n    cuotas mensuales. En tal caso la cuota mensual asciende a CHF 63.00 y la\n    prima anual total asciende a CHF 756.00.\n\n2.3 El recargo previsto en el punto 2.2 constituye la contraprestación por el\n    pago fraccionado y no es reembolsable en caso de resolución anticipada.\n\n2.4 Comisión de emisión y de recibo: CHF 40.00, de pago único, a la\n    contratación.\n\n3. DESCUENTO POR COMPROMISO PLURIANUAL\n\n3.1 El Tomador que se comprometa a mantener la póliza en vigor durante 5\n    (cinco) anualidades consecutivas obtendrá un descuento del 20.00% sobre la\n    prima anual bruta prevista en el punto 2.1.\n\n3.2 En caso de resolución o extinción antes de completar la quinta\n    anualidad, el Tomador estará obligado a reintegrar íntegramente los\n    descuentos obtenidos en las anualidades anteriores.\n\n3.3 El reintegro será exigible en el plazo de 30 días desde el requerimiento\n    de la Compañía.\n\n4. FRANQUICIAS Y LÍMITES\n\n4.1 Franquicia por siniestro con culpa, cobertura de colisión: CHF 1'000.00.\n4.2 Límite de indemnización de responsabilidad civil: CHF 100'000'000.00.\n4.3 Cobertura de robo e incendio: franquicia de CHF 500.00.\n\n5. MODIFICACIONES DE LA PRIMA\n\n5.1 La Compañía podrá modificar la prima con efectos desde la fecha de\n    vencimiento anual, comunicándolo al Tomador con al menos 25 días de\n    antelación a dicha fecha.\n5.2 En tal caso el Tomador podrá resolver el contrato en el plazo de 30 días\n    desde la recepción de la comunicación, como excepción al plazo previsto\n    en el punto 1.4.\n\n6. SINIESTROS\n\n6.1 Los siniestros deberán comunicarse en el plazo de 5 días desde que se\n    tuvo conocimiento del hecho.\n6.2 El sistema bonus-malus prevé un descenso de 3 niveles por cada siniestro\n    con culpa liquidado.\n\n7. FUERO COMPETENTE\n\nCualquier controversia se someterá al fuero del domicilio del Tomador.\n\nLugar y fecha ______________________\nFirma del Tomador ______________________\n",

  "auto_renewal","cancellation_notice_days","exit_lockin_months","exit_notice_days",
  "exit_penalty_type","exit_penalty_percent","exit_fixed_fees","insurance_required",
  "insurance_monthly_cost"];
const FORM = {financed_amount:"chf",monthly_payment:"chf",down_payment:"chf",upfront_fees:"chf",
  fee_per_payment:"chf",buyout_value:"chf",single_payment_alternative:"chf",insurance_monthly_cost:"chf",
  exit_fixed_fees:"chf",term_months:"months",exit_lockin_months:"months",
  cancellation_notice_days:"days",exit_notice_days:"days",nar_percent:"pct",apr_percent:"pct",
  exit_penalty_percent:"pct",auto_renewal:"yesno",insurance_required:"yesno",
  type:"text",exit_penalty_type:"text"};

/* ============================================================
   2. CALCULATIONS — deterministic. No model reaches this far.
      Reference version: extraction/calculations.py
   ============================================================ */
function v(f,name,d){ const x=f[name]; return (!x||x.value===null||x.value===undefined)?d:x.value; }
function outstandingCapital(pay,nar,term,k){
  const n = term-k; if(n<=0) return 0;
  if(!nar) return pay*n;
  const i = nar/1200; return pay*(1-Math.pow(1+i,-n))/i;
}
function params(f){return{
  kind:v(f,"type","other"), pay:v(f,"monthly_payment",0)||0, term:v(f,"term_months",0)||0,
  nar:v(f,"nar_percent",null), upfront:v(f,"upfront_fees",0)||0, perPay:v(f,"fee_per_payment",0)||0,
  down:v(f,"down_payment",0)||0, buyout:v(f,"buyout_value",0)||0, financed:v(f,"financed_amount",null),
  lockin:v(f,"exit_lockin_months",0)||0, penType:v(f,"exit_penalty_type","none"),
  penPct:v(f,"exit_penalty_percent",0)||0, penFix:v(f,"exit_fixed_fees",0)||0,
  penWaiver:v(f,"_exit_penalty_waiver_months",null),
  renewal:v(f,"auto_renewal",false), single:v(f,"single_payment_alternative",null)};}
function exitAt(p,k){
  const paid = p.down + p.upfront + (p.pay+p.perPay)*k;
  if(p.penType === "percent_of_outstanding_capital"){
    const rest = outstandingCapital(p.pay,p.nar,p.term,k);
    /* the loan waives the charge near the end of the term (Art. 5.3) */
    const waived = p.penWaiver !== null && (p.term - k) <= p.penWaiver;
    const pen = waived ? 0 : rest*p.penPct/100;
    return {cost: paid+rest+pen+p.penFix,
            parts:[[t("bPaid",{k}),paid],[t("bCapital"),rest],[t("bPenalty"),pen],[t("bFees"),p.penFix]]};
  }
  if(p.penType === "remaining_instalments_plus_percent"){
    const rest = p.pay*(p.term-k), pen = rest*p.penPct/100;
    return {cost: paid+rest+pen+p.penFix,
            parts:[[t("bPaid",{k}),paid],[t("bLeft"),rest],[t("bPenalty"),pen],[t("bFees"),p.penFix]]};
  }
  return null;
}
function analyse(f){
  const p = params(f), r = {p};
  r.totalCost = p.down + p.pay*p.term + p.upfront + p.perPay*p.term;
  r.totalWithBuyout = p.buyout ? r.totalCost + p.buyout : null;
  if(p.financed && p.kind==="consumer_credit") r.markup = r.totalCost - p.financed;
  else if(p.financed && p.kind==="lease")      r.markup = (r.totalCost + p.buyout) - p.financed;
  else r.markup = null;
  if(r.markup !== null && p.financed) r.markupPct = 100*r.markup/p.financed;
  r.exitMonth = Math.max(p.lockin, Math.floor(p.term/2));
  const e = exitAt(p, r.exitMonth);
  if(e){ r.exitCost = e.cost; r.exitParts = e.parts; r.exitDelta = r.totalCost - e.cost; }
  else if(p.penType === "repay_discounts"){ r.exitCost = null; r.exitNotComputable = t("ncMsg"); }
  else r.exitCost = null;
  r.renewalCost = p.renewal ? p.pay*p.term : null;
  if(p.single){ r.instalSur = p.pay*12 - p.single; r.instalSurPct = 100*(p.pay*12-p.single)/p.single; }
  return r;
}

/* ============================================================
   3. CONSOLIDATION
   ============================================================ */
function consolidate(readings){
  const out = {};
  for(const name of FIELDS){
    const values = readings.map(rd => (rd[name] ? rd[name].value : null));
    const tally = new Map();
    values.forEach(x => { const c = JSON.stringify(x); tally.set(c,(tally.get(c)||0)+1); });
    let best=null,count=0; for(const [c,n] of tally){ if(n>count){count=n;best=c;} }
    const src = readings.find(rd => rd[name] && JSON.stringify(rd[name].value)===best);
    out[name] = {value:JSON.parse(best), agreement:count, values,
                 quote: src&&src[name]?src[name].quote:null, where: src&&src[name]?src[name].where:null};
  }
  /* contract metadata travels with the fields but is never displayed and never
     voted on: it is one value, taken from the document, not read by the model */
  for(const rd of readings)
    for(const name of Object.keys(rd))
      if(name.charAt(0) === "_" && !(name in out)) out[name] = rd[name];
  return out;
}

/* ============================================================
   4. FORMATTING
   ============================================================ */
function chf(x,dec){ if(x===null||x===undefined) return "—";
  const d = dec===undefined?2:dec;
  return "CHF " + x.toLocaleString("de-CH",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function chf0(x){ return chf(Math.round(x),0); }
function pctStr(x){ return x.toLocaleString(LOCALE[LANG],{maximumFractionDigits:1}); }
function show(x,form){
  if(x===null||x===undefined) return t("stable");
  switch(form){
    case "chf": return chf(x);
    case "pct": return x.toLocaleString(LOCALE[LANG],{maximumFractionDigits:2}) + " %";
    case "months": return x + " " + (x===1 ? T.L.month : T.L.months);
    case "days": return x + " " + (x===1 ? T.L.day : T.L.days);
    case "yesno": return x ? T.L.yes : T.L.no;
    default: return T.L[x] || String(x);
  }
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])); }

/* ============================================================
   5. DOCUMENT PANE — provenance you can see
   ============================================================ */
let RAWTEXT = "", NORMTEXT = "", NORMMAP = [];
/* A clause in the contract is wrapped across several lines; the quotation is a
   single line of text. Comparing the two literally matches only up to the first
   line break, which highlights a fragment and calls it the sentence. So we
   search in a whitespace-normalised copy and keep a map back to the real
   offsets — the match is then the whole clause, exactly as the contract has it. */
function buildNorm(){
  NORMTEXT = ""; NORMMAP = [];
  let prevWasSpace = false;
  for(let i = 0; i < RAWTEXT.length; i++){
    const ch = RAWTEXT[i];
    if(/\s/.test(ch)){
      if(prevWasSpace) continue;
      NORMTEXT += " "; NORMMAP.push(i); prevWasSpace = true;
    } else {
      NORMTEXT += ch; NORMMAP.push(i); prevWasSpace = false;
    }
  }
}
function setRawText(text){ RAWTEXT = text; buildNorm(); }
function paintDoc(){ document.getElementById("doc").innerHTML = esc(RAWTEXT); }
function findRange(quote){
  if(!quote) return null;
  const clean = quote.replace(/…$/,"").trim().replace(/\s+/g," ");
  if(!clean) return null;
  /* normalised [i, i+len) -> raw [start, end) */
  const toRaw = (i, len) => [NORMMAP[i], NORMMAP[i + len - 1] + 1];
  let i = NORMTEXT.indexOf(clean);
  if(i >= 0) return toRaw(i, clean.length);
  const words = clean.split(" ");
  for(let n = words.length; n > 4; n -= 2){
    const frag = words.slice(0,n).join(" ");
    i = NORMTEXT.indexOf(frag);
    if(i >= 0) return toRaw(i, frag.length);
  }
  const first = words.slice(0,6).join(" ");
  i = NORMTEXT.indexOf(first);
  return i >= 0 ? toRaw(i, first.length) : null;
}
/* Used by the build-time check and available in the console: is every quotation
   an exact clause of the document on screen, not merely locatable? */
function quoteIsExact(quote){
  const r = findRange(quote);
  if(!r) return false;
  const a = RAWTEXT.slice(r[0], r[1]).replace(/\s+/g," ").trim();
  const b = quote.replace(/…$/,"").trim().replace(/\s+/g," ");
  return a === b;
}
function highlight(quote){
  const doc = document.getElementById("doc"), range = findRange(quote);
  if(!range){ paintDoc(); document.getElementById("docHint").textContent = t("notLocated"); return; }
  doc.innerHTML = esc(RAWTEXT.slice(0,range[0])) +
    '<mark class="hit" id="hit">' + esc(RAWTEXT.slice(range[0],range[1])) + '</mark>' +
    esc(RAWTEXT.slice(range[1]));
  document.getElementById("docHint").textContent = t("highlighted");
  const hit = document.getElementById("hit");
  doc.scrollTo({top: Math.max(0, hit.offsetTop - doc.clientHeight/2), behavior:"smooth"});
}

/* ============================================================
   6. CHARTS — one hue ramp for parts of a whole, one line + one reference
   ============================================================ */
function composition(r){
  const p = r.p, segs = [];
  if(p.kind === "consumer_credit" && p.financed){
    segs.push([t("sReceive"), p.financed, "var(--accent-1)"]);
    segs.push([t("sInterest"), p.pay*p.term - p.financed, "var(--accent-3)"]);
    segs.push([t("sFees"), p.upfront + p.perPay*p.term, "var(--accent-4)"]);
  } else {
    if(p.down) segs.push([t("sDown"), p.down, "var(--accent-1)"]);
    segs.push([t("sInstal"), p.pay*p.term, "var(--accent-3)"]);
    if(p.upfront + p.perPay*p.term) segs.push([t("sFees"), p.upfront + p.perPay*p.term, "var(--accent-4)"]);
  }
  const tot = segs.reduce((a,s)=>a+s[1],0);
  if(!tot) return "";
  const bars = segs.map(sg =>
    `<div style="width:${100*sg[1]/tot}%;background:${sg[2]};height:100%"></div>`
  ).join('<div style="width:2px;background:var(--surface);height:100%"></div>');
  const legend = segs.map(sg =>
    `<span class="lgd"><i style="background:${sg[2]}"></i>${sg[0]} — <b>${chf0(sg[1])}</b>
       <s>${(100*sg[1]/tot).toFixed(0)}%</s></span>`).join("");
  return `<div class="panel compo">
    <div class="compo-h">${t("whereMoney")}</div>
    <div class="compo-bar">${bars}</div>
    <div class="compo-legend">${legend}</div></div>`;
}


function exitChart(r,k){
  const p = r.p, W=560, H=260, L=70, R=22, Tp=26, B=40, pts=[];
  for(let m=Math.max(1,p.lockin); m<=p.term; m++){ const e=exitAt(p,m); if(e) pts.push([m,e.cost]); }
  if(!pts.length) return "";
  const ys = pts.map(q=>q[1]).concat([r.totalCost]);
  const lo = Math.min(...ys) - (Math.max(...ys)-Math.min(...ys))*0.18 - 1;
  const hi = Math.max(...ys) + (Math.max(...ys)-Math.min(...ys))*0.18 + 1;
  const x = m => L + (m-1)/Math.max(1,p.term-1)*(W-L-R);
  const y = c => Tp + (hi-c)/(hi-lo)*(H-Tp-B);
  const line = pts.map((q,i)=>(i?"L":"M")+x(q[0]).toFixed(1)+" "+y(q[1]).toFixed(1)).join(" ");
  const area = line + ` L ${x(pts[pts.length-1][0]).toFixed(1)} ${H-B} L ${x(pts[0][0]).toFixed(1)} ${H-B} Z`;
  const cur = pts.find(q=>q[0]===k) || pts[pts.length-1];
  const uid = "g"+Math.max(1,p.term);

  let grid="";
  for(let i=0;i<=4;i++){
    const c = lo+(hi-lo)*i/4, yy = y(c);
    grid += `<line x1="${L}" x2="${W-R}" y1="${yy.toFixed(1)}" y2="${yy.toFixed(1)}"
              stroke="var(--grid)" stroke-width="1"/>`
         +  `<text x="${L-10}" y="${(yy+3.5).toFixed(1)}" text-anchor="end" font-size="10"
              fill="var(--faint)" style="font-variant-numeric:tabular-nums">${chf0(c).replace("CHF ","")}</text>`;
  }
  let lock="";
  if(p.lockin>1){
    lock = `<rect x="${L}" y="${Tp}" width="${(x(p.lockin)-L).toFixed(1)}" height="${H-Tp-B}"
              fill="var(--bg-sink)"/>`
      + `<text x="${(L+5).toFixed(1)}" y="${Tp+13}" text-anchor="start"
              font-size="9.5" letter-spacing=".06em" fill="var(--faint)">${t("lockedIn")}</text>`;
  }
  const refY = y(r.totalCost);
  return `<svg class="exp-chart" viewBox="0 0 ${W} ${H}" width="100%" role="img"
     aria-label="${t("axis")}" style="display:block;overflow:visible">
    <defs>
      <linearGradient id="fill${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--accent)" stop-opacity=".20"/>
        <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${lock}${grid}
    <path d="${area}" fill="url(#fill${uid})"/>
    <line x1="${L}" x2="${W-R}" y1="${refY.toFixed(1)}" y2="${refY.toFixed(1)}"
          stroke="var(--muted)" stroke-width="1.75" stroke-dasharray="6 5"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.75"
          stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="${x(cur[0]).toFixed(1)}" x2="${x(cur[0]).toFixed(1)}" y1="${y(cur[1]).toFixed(1)}"
          y2="${H-B}" stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity=".45"/>
    <circle cx="${x(cur[0]).toFixed(1)}" cy="${y(cur[1]).toFixed(1)}" r="6.5"
            fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5"/>
    <text x="${L}" y="${Tp-11}" font-size="9.5" letter-spacing=".08em"
          fill="var(--faint)" style="text-transform:uppercase">${t("axis")}</text>
    <line x1="${L}" x2="${W-R}" y1="${H-B+1}" y2="${H-B+1}" stroke="var(--rule)" stroke-width="1"/>
    <text x="${L}" y="${H-16}" font-size="10" fill="var(--faint)">${t("month1")}</text>
    <text x="${W-R}" y="${H-16}" text-anchor="end" font-size="10"
          fill="var(--faint)">${t("monthN",{n:p.term})}</text>
    </svg>
    <div class="chart-legend">
      <span class="lgd"><i class="sw-line"></i>${t("walkAway")}</span>
      <span class="lgd"><i class="sw-dash"></i>${t("allTheWay",{a:chf0(r.totalCost)})}</span>
    </div>`;
}


function renderExplorer(r){
  const box = document.getElementById("explorerWrap"), p = r.p;
  if(r.exitCost === null || r.exitCost === undefined){ box.innerHTML=""; return; }
  const lo = Math.max(1,p.lockin), hi = p.term-1;
  let best=-Infinity, bestM=lo;
  for(let m=lo;m<=hi;m++){ const e=exitAt(p,m); if(e && r.totalCost-e.cost>best){best=r.totalCost-e.cost;bestM=m;} }
  const bestPct = 100*best/r.totalCost;
  const head = bestPct<=0 ? t("expNone") : (bestPct<6 ? t("expBest",{p:pctStr(bestPct)}) : t("expGen"));
  const note = bestPct<=0 ? t("cheapestNever")
                          : t("cheapest",{k:bestM, a:chf0(exitAt(p,bestM).cost)});
  box.innerHTML =
   `<h2 class="step" data-n="4">${t("h4")}</h2>
    <div class="panel explorer">
      <h3>${head}</h3><p class="intro">${t("expIntro")}</p>
      <div class="expgrid">
        <div><div id="chartHost">${exitChart(r,r.exitMonth)}</div>
          <div style="margin-top:14px"><input type="range" id="k" min="${lo}" max="${hi}" value="${r.exitMonth}" aria-label="month">
            <div class="slidelab"><span id="kv"></span><span id="kpct"></span></div></div>
          <p style="margin:14px 0 0;font-size:13.5px;color:var(--ink2)">${note}</p></div>
        <div><div class="exp-side-h">${t("outOfPocket")}</div>
          <div class="readout" id="ecost"></div>
          <div style="font-size:13.5px;color:var(--ink2);margin-bottom:14px" id="edelta"></div>
          <ul class="bd" id="ebd"></ul></div>
      </div></div>`;
  const slider = document.getElementById("k");
  const update = () => {
    const k = +slider.value, e = exitAt(p,k), d = r.totalCost - e.cost;
    document.getElementById("kv").innerHTML = t("dragLab",{k, n:p.term});
    document.getElementById("kpct").textContent = t("ofTerm",{p:Math.round(100*k/p.term)});
    slider.setAttribute("aria-valuetext", t("dragLab",{k, n:p.term}).replace(/<[^>]+>/g,""));
    const el = document.getElementById("ecost");
    el.textContent = chf(e.cost); el.className = "readout " + (d<0?"bad":"good");
    document.getElementById("edelta").innerHTML = d<0
      ? t("isMore",{a:chf(-d)}) : t("isLess",{a:chf(d), p:pctStr(100*d/r.totalCost)});
    document.getElementById("ebd").innerHTML =
      e.parts.filter(x=>x[1]).map(x=>`<li><span>${x[0]}</span><span class="n">${chf(x[1])}</span></li>`).join("")
      + `<li><span>${t("bTotal")}</span><span class="n">${chf(e.cost)}</span></li>`;
    document.getElementById("chartHost").innerHTML = exitChart(r,k);
  };
  slider.addEventListener("input", update); update();
}


/* ============================================================
   6b. THE TIMELINE — what the contract fixes in time
   ============================================================ */
function renderTimeline(r,f){
  const box = document.getElementById("timeline"), p = r.p;
  if(!p.term){ box.innerHTML=""; return; }
  const notice = v(f,"cancellation_notice_days",null);
  const span = Math.max(p.renewal ? p.term*1.34 : p.term*1.04, (p.lockin||0)*1.09);
  const W=760, H=132, L=14, R=14, AX=68;
  const x = m => L + (m/span)*(W-L-R);

  const pins = [{m:0, lab:t("tlSign")}];
  if(p.lockin>0) pins.push({m:p.lockin, lab:t("tlLocked")});
  if(p.renewal && notice) pins.push({m:Math.max(0,p.term-notice/30.44), lab:t("tlLastCancel"), tone:"accent"});
  pins.push({m:p.term, lab: p.buyout ? t("tlBuyout") : t("tlEnd"), tone: p.buyout ? "" : "ink"});
  if(p.renewal) pins.push({m:(p.term+span)/2, lab:t("tlRenews"), tone:"red", noMonth:true});
  pins.sort((a,b)=>a.m-b.m);

  const band = p.lockin>0
    ? `<rect x="${x(0).toFixed(1)}" y="${AX-13}" width="${(x(Math.min(p.lockin,span))-x(0)).toFixed(1)}"
         height="26" rx="6" fill="var(--bg-sink)"/>` : "";
  const tail = p.renewal
    ? `<line x1="${x(p.term).toFixed(1)}" x2="${x(span).toFixed(1)}" y1="${AX}" y2="${AX}"
         stroke="var(--red)" stroke-width="2.5" stroke-dasharray="5 5" stroke-linecap="round"/>` : "";

  const marks = pins.map((pin,i)=>{
    const px = x(pin.m), up = i%2===0;
    const col = pin.tone==="accent" ? "var(--accent)"
              : pin.tone==="red" ? "var(--red)"
              : pin.tone==="ink" ? "var(--ink)" : "var(--muted)";
    const anchor = px < 74 ? "start" : (px > W-74 ? "end" : "middle");
    const tx = anchor==="start" ? px-4 : (anchor==="end" ? px+4 : px);
    const ly = up ? AX-24 : AX+34, my = up ? AX-38 : AX+48;
    return `<line x1="${px.toFixed(1)}" x2="${px.toFixed(1)}"
              y1="${up?AX-13:AX+13}" y2="${up?AX-20:AX+20}" stroke="${col}" stroke-width="1.5"/>
      <circle cx="${px.toFixed(1)}" cy="${AX}" r="5" fill="${col}" stroke="var(--surface)" stroke-width="2"/>
      <text x="${tx.toFixed(1)}" y="${ly}" text-anchor="${anchor}" font-size="11.5"
            fill="var(--ink-2)">${pin.lab}</text>
      ${pin.noMonth ? "" : `<text x="${tx.toFixed(1)}" y="${my}" text-anchor="${anchor}" font-size="10"
            fill="var(--faint)">${t("tlMonth")} ${Math.round(pin.m)}</text>`}`;
  }).join("");

  box.innerHTML = `<div class="panel tl"><h3>${t("tlTitle")}</h3>
    <p class="intro">${t("tlIntro")}</p>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("tlTitle")}">
      ${band}
      <line x1="${x(0).toFixed(1)}" x2="${x(p.term).toFixed(1)}" y1="${AX}" y2="${AX}"
            stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>
      ${tail}${marks}
    </svg></div>`;
}

/* ============================================================
   6c. COMPARISON — the same twenty fields make them comparable
   ============================================================ */
function renderCompare(keys){
  const box = document.getElementById("compare");
  const set = keys.map(k => {
    const f = consolidate(DATA[LANG][k].readings);
    const r = analyse(f);
    return {k, f, r, stable: FIELDS.filter(n => f[n].agreement===3).length,
            title: DATA[LANG][k].title};
  });
  const cheapest = set.reduce((a,s)=> s.r.totalCost < a.r.totalCost ? s : a, set[0]);

  const head = set.map(s =>
    `<th><span>${T.L[s.r.p.kind]||s.r.p.kind}</span>${esc(s.title.split(" — ")[0])}
       ${s===cheapest && set.length>1 ? `<em class="flag">${t("cmpCheapest")}</em>` : ""}</th>`).join("");

  /* a row: label, per-column cell value, and — where "better" is well defined —
     a numeric key so the best cell gets its dot */
  const dot = `<i class="bdot" aria-hidden="true"></i>`;
  function row(label, cells, nums, lower){
    let best = null;
    if(nums){
      const fin = nums.filter(n => n!==null && n!==undefined && isFinite(n));
      if(fin.length>1) best = lower===false ? Math.max(...fin) : Math.min(...fin);
    }
    return `<tr><th class="rk">${label}</th>` + cells.map((c,i) =>
      `<td class="${c.cls||""}">${(best!==null && nums[i]===best ? dot : "")}${c.h}</td>`
    ).join("") + `</tr>`;
  }

  const deltas = set.map(s => (s.r.exitCost===null||s.r.exitCost===undefined) ? null : s.r.exitDelta);
  const rows = [];
  rows.push(row(T.F.monthly_payment,
    set.map(s=>({h:chf(s.r.p.pay), cls:"num"})), set.map(s=>s.r.p.pay)));
  rows.push(row(t("sTerm"),
    set.map(s=>({h:show(s.r.p.term,"months")})), null));
  rows.push(row(t("cmpTotal"),

   6d. MOTION — restrained, and switched off if the reader asked for that
   ============================================================ */
const CALM = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function stagger(root){
  if(CALM) return;
  const kids = [...root.children].filter(e => e.offsetParent !== null || e.tagName === "DIV");
  kids.forEach((e,i) => {
    e.classList.add("reveal");
    setTimeout(() => e.classList.add("in"), 40 + i*55);
  });
}
function countUp(el, target, fmt){
  if(CALM || !isFinite(target)){ el.textContent = fmt(target); return; }
  const t0 = performance.now(), dur = 620;
  const step = now => {
    const k = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-k,3);
    el.textContent = fmt(target*e);
    if(k<1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

let CURRENT = null;
function readingsBlock(x, name){
  const keep = JSON.stringify(x.value);
  const cols = x.values.map((q,i) => {
    const isKeep = JSON.stringify(q) === keep;
    const val = (q===null || q===undefined) ? t("rdNone") : show(q, FORM[name]);
    return `<div class="rd ${isKeep?"keep":""}"><span class="rk">${t("rdReading",{n:i+1})}</span>
      <span class="rv">${esc(val)}</span>${isKeep?`<span class="rt">${t("rdMajority")}</span>`:""}</div>`;
  }).join("");
  return `<div class="readings">${cols}</div><div class="rwhy">${t("rdWhy")}</div>`;
}
function render(f, text){
  CURRENT = {f, text};
  const r = analyse(f), p = r.p;
  setRawText(text); paintDoc();
  document.getElementById("docHint").textContent = t("clickHint");

  const cards = [];
  if(r.totalWithBuyout){
    cards.push({lab:t("totalThrough"), num:chf0(r.totalCost), raw:r.totalCost,
      sub:t("notYours",{a:chf0(p.buyout), b:chf0(r.totalWithBuyout), c:chf0(r.markup||0)})});
  } else {
    cards.push({lab:t("totalThrough"), num:chf0(r.totalCost), raw:r.totalCost,
      sub:r.markup!==null ? t("moreThan",{a:chf0(r.markup), p:pctStr(r.markupPct)}) : t("sumOf")});
  }
  if(r.exitCost !== null && r.exitCost !== undefined){
    const worse = r.exitDelta < 0;
    cards.push({cls:worse?"bad":"", lab:t("walkAt",{k:r.exitMonth}), num:chf0(r.exitCost), raw:r.exitCost,
      sub: worse ? t("worse",{a:chf0(-r.exitDelta)})
                 : t("better",{a:chf0(r.exitDelta), p:pctStr(100*r.exitDelta/r.totalCost)})});
  } else {
    cards.push({cls:"flat", lab:t("leaveBefore"), num:t("notComputable"), sub:t("pointsAt")});
  }
  if(r.renewalCost) cards.push({cls:"bad", lab:t("forget"), num:chf0(r.renewalCost), raw:r.renewalCost, sub:t("renews")});
  else if(r.instalSur) cards.push({lab:t("instalCost"), num:chf0(r.instalSur), raw:r.instalSur, sub:t("againstOne",{p:pctStr(r.instalSurPct)})});
  else cards.push({cls:"flat", lab:t("noticeLeave"),
    num: f.exit_notice_days.value ? f.exit_notice_days.value+" "+T.L.days : "—",
    sub: p.lockin ? t("notBefore",{m:p.lockin}) : t("inWriting")});
  document.getElementById("verdict").innerHTML = cards.map(c =>
    `<div class="vcard ${c.cls||""}"><div class="lab">${c.lab}</div>
     <div class="num">${c.num}</div><div class="sub">${c.sub}</div></div>`).join("");
  document.querySelectorAll("#verdict .num").forEach((el,i) => {
    if(cards[i] && typeof cards[i].raw === "number") countUp(el, cards[i].raw, x => chf0(x));
  });

  const strip = [[t("sTerm"), p.term+" "+T.sMonths]];
  if(p.nar) strip.push([T.F.nar_percent, show(p.nar,"pct")]);
  if(v(f,"apr_percent",null)) strip.push([t("sRate"), show(v(f,"apr_percent",null),"pct")]);
  strip.push([T.F.monthly_payment, chf(p.pay)]);
  if(p.buyout) strip.push([t("sBuyout"), chf0(p.buyout)]);
  if(p.upfront+p.perPay*p.term) strip.push([t("sFees"), chf0(p.upfront+p.perPay*p.term)]);
  document.getElementById("strip").innerHTML = strip.map(c =>
    `<div class="cell"><div class="cv">${c[1]}</div><div class="ck">${c[0]}</div></div>`).join("");
  document.getElementById("composition").innerHTML = composition(r);

  const rows = []; let stable = 0;
  FIELDS.forEach((name,idx) => {
    const x = f[name];
    if(x.agreement === 3) stable++;
    const empty = (x.value===null || x.value===0 || x.value===false);
    const always = ["monthly_payment","term_months","type","auto_renewal"].includes(name);
    if(empty && x.agreement===3 && !always) return;
    const cls = x.agreement===3?"p3":(x.agreement===2?"p2":"p1");
    const pill = x.agreement===3?"3 / 3":(x.agreement===2?"2 / 3":"1 / 3");
    rows.push(`<div class="item" data-i="${idx}" role="button" tabindex="0" aria-expanded="false">
      <span class="k">${T.F[name]}</span><span class="v">${show(x.value,FORM[name])}</span>
      <span class="pill ${cls}">${pill}</span></div>`);
    const dis = x.agreement<3 ? readingsBlock(x, name) : "";
    rows.push(`<div class="src hidden" id="s${idx}">` +
      (x.quote ? `<blockquote>${esc(x.quote)}</blockquote><div class="where">${esc(x.where||"")}</div>`
               : `<div class="where">${t("noSentence")}</div>`) + dis + `</div>`);
  });
  document.getElementById("items").innerHTML = rows.join("");
  document.getElementById("itemsCount").textContent = t("itemsCount",{a:stable, b:FIELDS.length});
  const openItem = el => {
    const i = el.dataset.i, box = document.getElementById("s"+i);
    document.querySelectorAll(".src").forEach(o => { if(o!==box) o.classList.add("hidden"); });
    document.querySelectorAll(".item").forEach(o => { if(o!==el) o.setAttribute("aria-expanded","false"); });
    const opening = box.classList.contains("hidden");
    box.classList.toggle("hidden");
    el.setAttribute("aria-expanded", opening ? "true" : "false");
    if(opening) highlight(f[FIELDS[i]].quote);
    else { paintDoc(); document.getElementById("docHint").textContent = t("clickHint"); }
  };
  document.querySelectorAll(".item").forEach(el => {
    el.onclick = () => openItem(el);
    el.onkeydown = ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); openItem(el); } };
  });

  /* the margin map: every extracted clause, placed where it lives in the document */
  const doclen = Math.max(1, RAWTEXT.length);
  const oldMap = document.querySelector(".docpane .mmap"); if(oldMap) oldMap.remove();
  const mm = document.createElement("div");
  mm.className = "mmap"; mm.setAttribute("aria-hidden","true");
  mm.innerHTML = FIELDS.map((name,idx) => {
    const x = f[name]; if(!x || !x.quote) return "";
    const rng = findRange(x.quote); if(!rng) return "";
    const cls = x.agreement===3?"p3":(x.agreement===2?"p2":"p1");
    return `<i class="${cls}" style="top:${(100*rng[0]/doclen).toFixed(2)}%" title="${T.F[name]}" data-i="${idx}"></i>`;
  }).join("");
  document.querySelector(".docpane").appendChild(mm);
  mm.querySelectorAll("i").forEach(el => el.onclick = () => {
    const it = document.querySelector(`.item[data-i="${el.dataset.i}"]`);
    if(it){ openItem(it); it.scrollIntoView({behavior:CALM?"auto":"smooth", block:"center"}); }
  });

  renderTimeline(r, f);
  renderExplorer(r); renderDeadline(f);

  const lim = [t("lim1"), t("lim2"), t("lim3")];
  // A contract that imposes an insurance without pricing it leaves a cost out of
  // every total on this page. Saying so is cheaper than being asked.
  if(f.insurance_required && f.insurance_required.value === true &&
     (!f.insurance_monthly_cost || f.insurance_monthly_cost.value == null))
    lim.unshift(t("lim6"));
  // The disagreement shown on the six sample contracts is ours, not a model's.
  // It is declared in the README, in variations.json and here — the only one of
  // the three the person using the page will actually read.
  if(DEMO) lim.unshift(t("lim4"), t("lim5"));
  if(r.exitNotComputable) lim.unshift(r.exitNotComputable);
  const unstable = FIELDS.filter(n => f[n].agreement<3).map(n => T.F[n]);
  if(unstable.length) lim.unshift(t("limUnstable",{f:unstable.join(", ")}));
  document.getElementById("limits").innerHTML = "<ul><li>"+lim.join("</li><li>")+"</li></ul>";
  document.getElementById("compare").classList.add("hidden");
  const box = document.getElementById("result");
  box.classList.remove("hidden");
  stagger(box);
}

function pad(n){ return String(n).padStart(2,"0"); }
function icsDate(d){ return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate()); }
function renderDeadline(f){
  const box = document.getElementById("deadline");
  const renews = f.auto_renewal.value, notice = f.cancellation_notice_days.value;
  if(!renews || !notice){ box.innerHTML=""; return; }
  box.innerHTML = `<div class="notice calm"><h3>${t("dlTitle")}</h3>
    <p style="margin:0 0 12px;color:var(--ink2)">${t("dlIntro",{d:notice})}</p>
    <div class="row" style="max-width:640px">
      <div><label class="lab" for="expiry">${t("dlExpiry")}</label><input type="date" id="expiry"></div>
      <div style="flex:0 0 auto"><button class="ghost" id="makeIcs">${t("dlWork")}</button></div>
    </div><div id="deadlineOut" style="margin-top:14px"></div></div>`;
  document.getElementById("makeIcs").onclick = () => {
    const raw = document.getElementById("expiry").value, out = document.getElementById("deadlineOut");
    if(!raw){ out.innerHTML = `<span style="color:var(--red)">${t("dlEnter")}</span>`; return; }
    const expiry = new Date(raw+"T12:00:00Z");
    const last = new Date(expiry.getTime() - notice*86400000);
    const remind = new Date(last.getTime() - 14*86400000);
    const fmt = d => d.toLocaleDateString(LOCALE[LANG],{day:"numeric",month:"long",year:"numeric"});
    out.innerHTML = `<p style="margin:0 0 6px">${t("dlLast",{d:fmt(last)})}${last<new Date()?t("dlPassed"):""}.</p>
      <p style="margin:0 0 12px;font-size:13.5px;color:var(--muted)">${t("dlRemind",{d:fmt(remind)})}</p>
      <a id="icsLink" download="cancellation-deadline.ics" href="#">${t("dlDownload")}</a>`;
    /* RFC 5545: for an all-day event DTEND is exclusive, so it is the next day;
       commas, semicolons and backslashes are escaped inside a TEXT value; and a
       content line is folded at 75 octets with a leading space on continuations. */
    const icsText = v => String(v).replace(/\\/g,"\\\\").replace(/;/g,"\\;")
                                  .replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
    const fold = line => {
      const bytes = [...line].map(c => [c, new TextEncoder().encode(c).length]);
      const out = []; let cur = "", len = 0;
      for(const [c, n] of bytes){
        if(len + n > (out.length ? 74 : 75)){ out.push(cur); cur = ""; len = 0; }
        cur += c; len += n;
      }
      out.push(cur);
      return out.map((l,i) => i ? " " + l : l).join("\r\n");
    };
    const dayAfter = new Date(remind.getTime() + 86400000);
    const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Clausola//EN","CALSCALE:GREGORIAN",
      "BEGIN:VEVENT",
      "UID:clausola-"+icsDate(last)+"@local","DTSTAMP:"+icsDate(new Date())+"T090000Z",
      "DTSTART;VALUE=DATE:"+icsDate(remind),"DTEND;VALUE=DATE:"+icsDate(dayAfter),
      "SUMMARY:"+icsText(t("dlSummary",{d:notice, x:fmt(last)})),
      "DESCRIPTION:"+icsText(t("dlDesc",{x:fmt(last)})),
      "END:VEVENT","END:VCALENDAR"].map(fold).join("\r\n");
    document.getElementById("icsLink").href = "data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);
  };
}

const PROMPT = ["# Who you are","You extract clauses from consumer financial contracts.","",
 "# What you do","You read the contract and report the fields required by the JSON schema.",
 "For every field you also report the LITERAL sentence of the contract you took it from,",
 "and its location (article or point). The contract may be in any language: quote it in its",
 "own language, do not translate.","",
 "# How you do it","- You calculate nothing. You do not add, multiply or estimate.",
 "- If a value is not written in the contract, the field is null and so is the quote.",
 "- You do not derive one value from another.","- The quote is copied from the text, not rewritten.",
 "- Amounts are numbers, with no currency symbol and no thousands separator."].join("\n");
function jsonSchema(){
  const props={}, req=[];
  const numeric = new Set(["financed_amount","monthly_payment","term_months","nar_percent","apr_percent",
    "down_payment","upfront_fees","fee_per_payment","buyout_value","single_payment_alternative",
    "cancellation_notice_days","exit_lockin_months","exit_notice_days","exit_penalty_percent",
    "exit_fixed_fees","insurance_monthly_cost"]);
  const boolean = new Set(["auto_renewal","insurance_required"]);
  for(const name of FIELDS){
    const ty = numeric.has(name)?"number":(boolean.has(name)?"boolean":"string");
    props[name] = {type:"object", additionalProperties:false,
      properties:{value:{type:[ty,"null"]}, quote:{type:["string","null"]}, where:{type:["string","null"]}},
      required:["value","quote","where"]};
    req.push(name);
  }
  return {type:"object", additionalProperties:false, properties:props, required:req};
}
async function readOnce(text){
  const res = await fetch("http://localhost:1234/v1/chat/completions",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"local-model", temperature:0.3,
      messages:[{role:"system",content:PROMPT},{role:"user",content:text}],
      response_format:{type:"json_schema", json_schema:{name:"contract",strict:true,schema:jsonSchema()}}})});
  if(!res.ok) throw new Error("LM Studio replied "+res.status);
  return JSON.parse((await res.json()).choices[0].message.content);
}

const ICO_SUN = '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="currentColor" stroke="none"/><path d="M12 2v2.4M12 19.6V22M2 12h2.4M19.6 12H22M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M19.1 4.9l-1.7 1.7M6.6 17.4l-1.7 1.7"/></svg>';
const ICO_MOON = '<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M20.6 14.9A8.7 8.7 0 0 1 9.1 3.4 8.7 8.7 0 1 0 20.6 14.9z"/></svg>';
function effTheme(){ return THEME || (mqDark.matches ? "dark" : "light"); }
function paintTheme(){
  if(THEME) document.documentElement.dataset.theme = THEME;
  else document.documentElement.removeAttribute("data-theme");
  document.getElementById("themeBtn").innerHTML = effTheme()==="dark" ? ICO_SUN : ICO_MOON;
}
document.getElementById("themeBtn").onclick = () => {
  THEME = effTheme()==="dark" ? "light" : "dark"; paintTheme();
};
mqDark.addEventListener("change", paintTheme);
paintTheme();
document.querySelectorAll("#langs button").forEach(b => b.onclick = () => {
  const wasOpen = !document.getElementById("result").classList.contains("hidden");
  const sameDoc = pick.value !== "__mine__" ? pick.value : null;
  const cmpOpen = !document.getElementById("compare").classList.contains("hidden");
  const cmpKeys = [...cmpPicks.querySelectorAll("input:checked")].map(i => i.value);
  LANG = b.dataset.l; applyLang();
  if(sameDoc){ area.value = DATA[LANG][sameDoc].text; DEMO = true;
    if(wasOpen && !cmpOpen) render(consolidate(DATA[LANG][sameDoc].readings), DATA[LANG][sameDoc].text); }
  if(cmpOpen && cmpKeys.length>1) renderCompare(cmpKeys);
});
tabs.querySelectorAll("button").forEach(b => b.onclick = () => setMode(b.dataset.m));
document.getElementById("cmpRun").onclick = () => {
  errorBox.classList.add("hidden");
  const keys = [...cmpPicks.querySelectorAll("input:checked")].map(i => i.value);
  if(keys.length < 2){
    errorBox.textContent = t("cmpNeed2"); errorBox.classList.remove("hidden"); return;
  }
  if(new Set(keys.map(docType)).size > 1){
    errorBox.textContent = t("cmpSameKind"); errorBox.classList.remove("hidden"); return;
  }
  renderCompare(keys); goToResult();
};

function loadText(){
  if(pick.value === "__mine__"){ area.value=""; area.focus(); }
  else area.value = DATA[LANG][pick.value].text;
}
pick.onchange = loadText;
applyLang(); loadText();

document.getElementById("read").onclick = async () => {
  errorBox.classList.add("hidden");
  const k = pick.value, text = area.value.trim();
  if(!text){ errorBox.textContent = t("errPaste"); errorBox.classList.remove("hidden"); return; }
  if(k !== "__mine__" && text === DATA[LANG][k].text.trim()){
    DEMO = true;
    modeTag.textContent = t("modeDemo"); modeTag.classList.remove("live");
    render(consolidate(DATA[LANG][k].readings), text); goToResult(); return;
  }
  modeTag.textContent = t("modeRun");
  try{
    const readings=[]; for(let i=0;i<3;i++) readings.push(await readOnce(text));
    DEMO = false;
    modeTag.textContent = t("modeLive"); modeTag.classList.add("live");
    render(consolidate(readings), text); goToResult();
  }catch(e){
    modeTag.textContent = t("modeDemo"); modeTag.classList.remove("live");
    errorBox.innerHTML = t("lmErr") + "<br><small>"+esc(e.message)+"</small>";
    errorBox.classList.remove("hidden");
  }
};

/* ============================================================
   11. THE CHF 6 REPORT — the unit of sale, as a printable page
   ============================================================ */
function reportHTML(f){
  const r = analyse(f);
  const title = (pick.value !== "__mine__" && DATA[LANG][pick.value])
    ? DATA[LANG][pick.value].title
    : (CURRENT.text.trim().split("\n")[0] || "—").slice(0, 90);
  const today = new Date().toLocaleDateString(LOCALE[LANG],{day:"numeric",month:"long",year:"numeric"});
  const big = [[t("totalThrough"), chf0(r.totalCost)]];
  big.push((r.exitCost!==null && r.exitCost!==undefined)
    ? [t("walkAt",{k:r.exitMonth}), chf0(r.exitCost)]
    : [t("leaveBefore"), t("notComputable")]);
  if(r.renewalCost) big.push([t("forget"), chf0(r.renewalCost)]);
  else if(r.instalSur) big.push([t("instalCost"), chf0(r.instalSur)]);
  else if(f.exit_notice_days.value)
    big.push([t("noticeLeave"), f.exit_notice_days.value + " " + T.L.days]);
  let rows = "";
  FIELDS.forEach(name => {
    const x = f[name];
    if(x.value===null || x.value===undefined) return;
    if((x.value===0 || x.value===false) && !x.quote) return;
    rows += `<tr><td>${T.F[name]}</td><td class="rv">${show(x.value,FORM[name])}</td>
      <td class="ra">${x.agreement} / 3</td>
      <td class="rq">${x.quote ? `<em>${esc(x.quote)}</em> <span>— ${esc(x.where||"")}</span>` : "—"}</td></tr>`;
  });
  const unstable = FIELDS.filter(n => f[n].agreement<3).map(n => T.F[n]);
  const lims = [t("lim1"), t("lim2"), t("lim3")];
  if(unstable.length) lims.unshift(t("limUnstable",{f:unstable.join(", ")}));
  return `<div class="rep-head">
      <div><div class="rep-brand">Clausola<em>.</em></div><div class="rep-tag">${t("repTag")}</div></div>
      <div class="rep-meta">${esc(title)}<br>${today}</div></div>
    <div class="rep-big">${big.map(b=>`<div><span>${b[0]}</span><strong>${b[1]}</strong></div>`).join("")}</div>
    <h2>${t("repClauses")}</h2>
    <table><tbody>${rows}</tbody></table>
    <div class="rep-lims"><ul>${lims.map(l=>`<li>${l}</li>`).join("")}</ul></div>
    <div class="rep-foot">${t("foot1")}</div>`;
}
document.getElementById("repBtn").onclick = () => {
  if(!CURRENT) return;
  document.getElementById("report").innerHTML = reportHTML(CURRENT.f);
  document.body.classList.add("print-report");
  const done = () => { document.body.classList.remove("print-report");
    window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  window.print();
};

/* the pipeline animates open the first time the details is expanded */
document.querySelector("details.explain").addEventListener("toggle", e => {
  if(e.target.open){ const p = document.querySelector("#hwBody .pipe"); if(p) stagger(p); }
});

/* ============================================================
   12. PRESENTATION MODE — a scripted, keyboard-driven walk
   ============================================================ */
const tourEl = document.getElementById("tour"),
      tourCapEl = document.getElementById("tourCapEl"),
      tourStepEl = document.getElementById("tourStepEl");
let TOURI = -1, TOURLANG = null;

function tourScroll(sel){
  const e = document.querySelector(sel);
  if(e) e.scrollIntoView({behavior: CALM ? "auto" : "smooth", block:"center"});
}
function tourLease(){
  if(MODE !== "one") setMode("one");
  document.getElementById("compare").classList.add("hidden");
  pick.value = "02_car_lease";
  area.value = DATA[LANG]["02_car_lease"].text;
  render(consolidate(DATA[LANG]["02_car_lease"].readings), DATA[LANG]["02_car_lease"].text);
}
function tourOpen(field){
  const it = document.querySelector(`.item[data-i="${FIELDS.indexOf(field)}"]`);
  if(it && it.getAttribute("aria-expanded") !== "true") it.click();
}
const TOURSTEPS = [
  () => { tourLease(); tourScroll("#verdict"); },
  () => { tourLease(); tourOpen("exit_penalty_type"); tourScroll(".reader"); },
  () => { tourLease(); tourScroll("#timeline"); },
  () => { tourLease(); const k = document.getElementById("k");
          if(k){ k.value = 24; k.dispatchEvent(new Event("input")); } tourScroll("#explorerWrap"); },
  () => { tourLease(); tourOpen("financed_amount"); tourScroll(".reader"); },
  () => { if(LANG !== TOURLANG) document.querySelector(`#langs button[data-l="${TOURLANG}"]`).click();
          renderCompare(["02_car_lease","02b_car_lease"]); tourScroll("#compare"); },
  () => { window.scrollTo({top:0, behavior: CALM ? "auto" : "smooth"}); },
];
function tourShow(i){
  TOURI = i;
  TOURSTEPS[i]();
  /* the page may switch language mid-tour (that is the point of step 5);
     the captions stay in the language the presentation was started in */
  const TT = I18N[TOURLANG] || T;
  tourCapEl.textContent = TT.tourCap[i];
  tourStepEl.textContent = TT.tourStep.replace("{a}", i+1).replace("{b}", TOURSTEPS.length);
  document.getElementById("tourKeysEl").textContent = TT.tourKeys;
}
function tourExit(){
  TOURI = -1;
  tourEl.classList.add("hidden");
  if(TOURLANG && LANG !== TOURLANG)
    document.querySelector(`#langs button[data-l="${TOURLANG}"]`).click();
}
document.getElementById("tourStart").onclick = () => {
  TOURLANG = LANG;
  tourEl.classList.remove("hidden");
  tourShow(0);
};
document.addEventListener("keydown", ev => {
  if(TOURI < 0) return;
  if(ev.key === "ArrowRight" || ev.key === " " || ev.key === "PageDown"){
    ev.preventDefault();
    if(TOURI >= TOURSTEPS.length-1) tourExit(); else tourShow(TOURI+1);
  } else if(ev.key === "ArrowLeft" || ev.key === "PageUp"){
    ev.preventDefault();
    if(TOURI > 0) tourShow(TOURI-1);
  } else if(ev.key === "Escape"){
    ev.preventDefault(); tourExit();
  }
});
</script>
